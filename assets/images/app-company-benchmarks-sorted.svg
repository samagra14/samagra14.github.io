<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="540" fill="#fbfaf7"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Seven benchmarks from application companies, sorted by what they check</text>

  <rect x="24" y="60" width="296" height="66" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/>
  <text x="172" y="86" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f46">State-checked simulations</text>
  <text x="172" y="108" text-anchor="middle" font-size="12" fill="#065f46">code checks the final state of a simulated world</text>
  <rect x="332" y="60" width="296" height="66" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="480" y="86" text-anchor="middle" font-size="14.5" font-weight="700" fill="#92400e">Agent tasks over fixed documents</text>
  <text x="480" y="108" text-anchor="middle" font-size="12" fill="#92400e">model judges grade the work against expert rubrics</text>
  <rect x="640" y="60" width="296" height="66" rx="8" fill="#f5f5f4" stroke="#57534e" stroke-width="1.3"/>
  <text x="788" y="86" text-anchor="middle" font-size="14.5" font-weight="700" fill="#292524">Static question sets</text>
  <text x="788" y="108" text-anchor="middle" font-size="12" fill="#292524">fixed questions with fixed answers</text>

  <rect x="24" y="140" width="296" height="86" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="40" y="166" font-size="13.5" font-weight="700" fill="#1c1917">AutomationBench, Zapier</text>
  <text x="40" y="188" font-size="12" fill="#44403c">April 20, 2026</text>
  <text x="40" y="208" font-size="12" fill="#292524">47 simulated apps and 600 public tasks</text>
  <rect x="24" y="238" width="296" height="86" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="40" y="264" font-size="13.5" font-weight="700" fill="#1c1917">ITSMBench, Atomicwork</text>
  <text x="40" y="286" font-size="12" fill="#44403c">August 12, 2026, built with New Measure</text>
  <text x="40" y="306" font-size="12" fill="#292524">89 tickets across 42 mocked apps</text>
  <rect x="24" y="336" width="296" height="86" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="40" y="362" font-size="13.5" font-weight="700" fill="#1c1917">&#964;&#179;-bench, Sierra</text>
  <text x="40" y="384" font-size="12" fill="#44403c">March 18, 2026, first version in 2024</text>
  <text x="40" y="404" font-size="12" fill="#292524">simulated customers, policies, and voice</text>

  <rect x="332" y="140" width="296" height="86" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="348" y="166" font-size="13.5" font-weight="700" fill="#1c1917">LAB, Harvey</text>
  <text x="348" y="188" font-size="12" fill="#44403c">May 6, 2026</text>
  <text x="348" y="208" font-size="12" fill="#292524">1,660 legal tasks and two model judges</text>
  <rect x="332" y="238" width="296" height="86" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="348" y="264" font-size="13.5" font-weight="700" fill="#1c1917">BAR, Legora</text>
  <text x="348" y="286" font-size="12" fill="#44403c">July 24, 2026</text>
  <text x="348" y="306" font-size="12" fill="#292524">runs in Legora's product, relative scores</text>
  <rect x="332" y="336" width="296" height="86" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="348" y="362" font-size="13.5" font-weight="700" fill="#1c1917">BigFinanceBench, Rogo</text>
  <text x="348" y="384" font-size="12" fill="#44403c">June 2026</text>
  <text x="348" y="404" font-size="12" fill="#292524">928 finance items with 15,656 criteria</text>

  <rect x="640" y="140" width="296" height="104" rx="8" fill="#ffffff" stroke="#57534e" stroke-width="1.2"/>
  <text x="656" y="166" font-size="13.5" font-weight="700" fill="#1c1917">TaxBench, Rivet</text>
  <text x="656" y="188" font-size="12" fill="#44403c">May 2026</text>
  <text x="656" y="208" font-size="12" fill="#292524">250+ tax scenarios, kept private,</text>
  <text x="656" y="226" font-size="12" fill="#292524">with the grading method undocumented</text>

  <rect x="24" y="440" width="912" height="84" rx="8" fill="#ffffff" stroke="#57534e" stroke-width="1.2"/>
  <text x="40" y="464" font-size="13" font-weight="700" fill="#1c1917">More simulations from application companies since then</text>
  <text x="40" y="487" font-size="12.5" fill="#292524">Ramp Accounting Bench with 22 simulated companies, ServiceNow EnterpriseOps-Gym, Surge EnterpriseBench CoreCraft,</text>
  <text x="40" y="507" font-size="12.5" fill="#292524">Cursor CursorBench 4.0, and Meituan VitaBench, which simulates food delivery, shopping, and travel</text>
</svg>
