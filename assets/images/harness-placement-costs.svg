<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44403c"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#fbfaf7"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Two places to put the harness</text>
  <line x1="480" y1="56" x2="480" y2="540" stroke="#d6d3d1" stroke-width="1.5"/>

  <text x="240" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">Harness inside the sandbox environment</text>
  <rect x="70" y="86" width="340" height="44" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="240" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Inference provider</text>
  <rect x="40" y="176" width="400" height="220" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="240" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Sandbox environment: one machine</text>
  <rect x="64" y="214" width="170" height="160" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="149" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">Harness</text>
  <text x="149" y="266" text-anchor="middle" font-size="13" fill="#292524">API key</text>
  <text x="149" y="290" text-anchor="middle" font-size="13" fill="#292524">session record</text>
  <text x="149" y="314" text-anchor="middle" font-size="13" fill="#292524">loop position</text>
  <rect x="250" y="214" width="170" height="160" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="335" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">Tool commands</text>
  <text x="335" y="266" text-anchor="middle" font-size="13" fill="#292524">repository</text>
  <text x="335" y="290" text-anchor="middle" font-size="13" fill="#292524">test suite</text>
  <text x="335" y="314" text-anchor="middle" font-size="13" fill="#292524">local process starts</text>
  <line x1="149" y1="212" x2="149" y2="133" stroke="#44403c" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="160" y="160" font-size="12" fill="#44403c">outbound network required</text>
  <text x="60" y="428" font-size="13.5" fill="#1c1917">The session ends when the sandbox ends.</text>
  <text x="60" y="454" font-size="13.5" fill="#1c1917">Commands run on the machine that holds the key.</text>
  <text x="60" y="480" font-size="13.5" fill="#1c1917">The sandbox keeps running while the model writes.</text>
  <text x="60" y="506" font-size="13.5" fill="#1c1917">Each tool call is a fast local process start.</text>

  <text x="720" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">Harness outside the sandbox environment</text>
  <rect x="550" y="86" width="340" height="44" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="720" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Inference provider</text>
  <rect x="520" y="160" width="400" height="104" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="720" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">Harness environment</text>
  <text x="720" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">Harness</text>
  <text x="720" y="236" text-anchor="middle" font-size="13" fill="#292524">API key, session record, loop position</text>
  <line x1="720" y1="158" x2="720" y2="133" stroke="#44403c" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="520" y="310" width="400" height="92" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="720" y="334" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Sandbox environment: a replaceable machine</text>
  <text x="720" y="360" text-anchor="middle" font-size="13" fill="#292524">repository, test suite, tool commands</text>
  <text x="720" y="384" text-anchor="middle" font-size="13" fill="#292524">outbound network can be closed</text>
  <line x1="680" y1="266" x2="680" y2="307" stroke="#44403c" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="672" y="292" text-anchor="end" font-size="12" fill="#44403c">tool call over the network</text>
  <line x1="760" y1="307" x2="760" y2="266" stroke="#44403c" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="768" y="292" font-size="12" fill="#44403c">tool result</text>
  <text x="540" y="428" font-size="13.5" fill="#1c1917">Every tool call crosses the network.</text>
  <text x="540" y="454" font-size="13.5" fill="#1c1917">A failed sandbox is replaced and the session continues.</text>
  <text x="540" y="480" font-size="13.5" fill="#1c1917">The sandbox can hibernate while the model writes.</text>
  <text x="540" y="506" font-size="13.5" fill="#1c1917">The key stays on the harness machine.</text>
</svg>
