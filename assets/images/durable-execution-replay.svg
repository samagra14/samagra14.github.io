<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44403c"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#fbfaf7"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Replaying a money transfer after a worker stops</text>

  <rect x="24" y="64" width="270" height="250" rx="14" fill="#ffffff" stroke="#57534e" stroke-width="1.5"/>
  <text x="159" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">Workflow code</text>
  <text x="44" y="126" font-size="13.5" fill="#292524">1. withdraw from account A</text>
  <text x="44" y="162" font-size="13.5" fill="#292524">2. deposit into account B</text>
  <text x="44" y="198" font-size="13.5" fill="#292524">3. refund account A when</text>
  <text x="62" y="218" font-size="13.5" fill="#292524">the deposit fails</text>
  <text x="44" y="258" font-size="12.5" fill="#57534e">each step is an activity sent</text>
  <text x="44" y="276" font-size="12.5" fill="#57534e">with a reference ID as its</text>
  <text x="44" y="294" font-size="12.5" fill="#57534e">idempotency key</text>

  <rect x="330" y="64" width="300" height="250" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">Event history in the Temporal Service</text>
  <rect x="350" y="106" width="260" height="34" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="480" y="128" text-anchor="middle" font-size="13" fill="#292524">workflow started</text>
  <rect x="350" y="148" width="260" height="34" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="480" y="170" text-anchor="middle" font-size="13" fill="#292524">withdraw scheduled</text>
  <rect x="350" y="190" width="260" height="34" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="480" y="212" text-anchor="middle" font-size="13" fill="#292524">withdraw completed, result recorded</text>
  <rect x="350" y="232" width="260" height="34" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="480" y="254" text-anchor="middle" font-size="13" fill="#9a3412">deposit: result missing</text>
  <text x="480" y="294" text-anchor="middle" font-size="12.5" fill="#3730a3">stored outside every worker</text>

  <rect x="666" y="64" width="270" height="250" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="801" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Second worker replays</text>
  <text x="686" y="126" font-size="13.5" fill="#292524">withdraw: receives the</text>
  <text x="686" y="146" font-size="13.5" fill="#292524">recorded result, and the</text>
  <text x="686" y="166" font-size="13.5" fill="#292524">bank receives zero new calls</text>
  <text x="686" y="208" font-size="13.5" fill="#292524">deposit: runs for real,</text>
  <text x="686" y="228" font-size="13.5" fill="#292524">because it is the first step</text>
  <text x="686" y="248" font-size="13.5" fill="#292524">whose result is missing</text>

  <line x1="294" y1="189" x2="327" y2="189" stroke="#44403c" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="630" y1="189" x2="663" y2="189" stroke="#44403c" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text x="480" y="364" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">What happens over time</text>
  <line x1="60" y1="420" x2="900" y2="420" stroke="#44403c" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="80" y="398" width="330" height="44" rx="8" fill="#ffffff" stroke="#57534e" stroke-width="1.3"/>
  <text x="245" y="425" text-anchor="middle" font-size="13" fill="#292524">first worker runs the withdrawal</text>
  <circle cx="450" cy="420" r="16" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="450" y="425" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">X</text>
  <text x="450" y="466" text-anchor="middle" font-size="12.5" fill="#991b1b">first worker stops</text>
  <rect x="492" y="398" width="380" height="44" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.3"/>
  <text x="682" y="425" text-anchor="middle" font-size="13" fill="#292524">second worker replays and runs the deposit</text>
</svg>
