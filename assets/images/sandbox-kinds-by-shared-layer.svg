<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44403c"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#fbfaf7"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Four kinds of sandbox and what each one shares with the host</text>

  <text x="130" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">Process sandbox</text>
  <text x="365" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">Container</text>
  <text x="600" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">User-space kernel</text>
  <text x="835" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">MicroVM</text>

  <rect x="30" y="92" width="200" height="46" rx="8" fill="#ffffff" stroke="#57534e" stroke-width="1.3"/>
  <text x="130" y="120" text-anchor="middle" font-size="13" fill="#292524">commands from tool calls</text>
  <rect x="265" y="92" width="200" height="46" rx="8" fill="#ffffff" stroke="#57534e" stroke-width="1.3"/>
  <text x="365" y="120" text-anchor="middle" font-size="13" fill="#292524">commands from tool calls</text>
  <rect x="500" y="92" width="200" height="46" rx="8" fill="#ffffff" stroke="#57534e" stroke-width="1.3"/>
  <text x="600" y="120" text-anchor="middle" font-size="13" fill="#292524">commands from tool calls</text>
  <rect x="735" y="92" width="200" height="46" rx="8" fill="#ffffff" stroke="#57534e" stroke-width="1.3"/>
  <text x="835" y="120" text-anchor="middle" font-size="13" fill="#292524">commands from tool calls</text>

  <rect x="735" y="146" width="200" height="46" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/>
  <text x="835" y="174" text-anchor="middle" font-size="13" fill="#065f46">guest kernel</text>
  <rect x="735" y="200" width="200" height="46" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/>
  <text x="835" y="222" text-anchor="middle" font-size="13" fill="#065f46">Firecracker with KVM</text>
  <text x="835" y="238" text-anchor="middle" font-size="11.5" fill="#065f46">hardware virtualization</text>

  <rect x="500" y="146" width="200" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/>
  <text x="600" y="190" text-anchor="middle" font-size="13" fill="#065f46">gVisor kernel</text>
  <text x="600" y="208" text-anchor="middle" font-size="11.5" fill="#065f46">answers system calls in user space</text>

  <rect x="265" y="146" width="200" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/>
  <text x="365" y="190" text-anchor="middle" font-size="13" fill="#065f46">namespaces and</text>
  <text x="365" y="208" text-anchor="middle" font-size="13" fill="#065f46">control groups</text>

  <rect x="30" y="146" width="200" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/>
  <text x="130" y="182" text-anchor="middle" font-size="13" fill="#065f46">rules on one process:</text>
  <text x="130" y="200" text-anchor="middle" font-size="12" fill="#065f46">Seatbelt, Landlock,</text>
  <text x="130" y="216" text-anchor="middle" font-size="12" fill="#065f46">seccomp, bubblewrap</text>

  <rect x="30" y="256" width="670" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="365" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">host kernel, shared with every other program on the machine</text>
  <rect x="735" y="256" width="200" height="46" rx="8" fill="#f5f5f4" stroke="#57534e" stroke-width="1.3"/>
  <text x="835" y="284" text-anchor="middle" font-size="13" fill="#292524">host kernel</text>
  <rect x="30" y="310" width="905" height="40" rx="8" fill="#f5f5f4" stroke="#57534e" stroke-width="1.3"/>
  <text x="482" y="335" text-anchor="middle" font-size="13" fill="#292524">physical machine</text>

  <text x="130" y="380" text-anchor="middle" font-size="12.5" fill="#44403c">Codex CLI, Claude Code,</text>
  <text x="130" y="398" text-anchor="middle" font-size="12.5" fill="#44403c">Cursor desktop agent</text>
  <text x="365" y="380" text-anchor="middle" font-size="12.5" fill="#44403c">Codex cloud, Daytona</text>
  <text x="600" y="380" text-anchor="middle" font-size="12.5" fill="#44403c">Modal, GKE Sandbox</text>
  <text x="835" y="380" text-anchor="middle" font-size="12.5" fill="#44403c">E2B, Vercel Sandbox,</text>
  <text x="835" y="398" text-anchor="middle" font-size="12.5" fill="#44403c">Cursor cloud agents</text>

  <text x="130" y="428" text-anchor="middle" font-size="12.5" fill="#1c1917">starts instantly</text>
  <text x="365" y="428" text-anchor="middle" font-size="12.5" fill="#1c1917">starts from an image</text>
  <text x="600" y="428" text-anchor="middle" font-size="12.5" fill="#1c1917">slower on heavy system calls</text>
  <text x="835" y="428" text-anchor="middle" font-size="12.5" fill="#1c1917">own kernel, more memory</text>

  <line x1="60" y1="476" x2="900" y2="476" stroke="#44403c" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="480" y="466" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1917">stronger isolation from left to right</text>
  <text x="480" y="500" text-anchor="middle" font-size="13" fill="#44403c">slower start and more memory from left to right</text>
</svg>
